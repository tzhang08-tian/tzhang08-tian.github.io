<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jungle Jungle Records — Tianyu Zhang</title>
  <style>
    body {
      font-family: monospace;
      color: #111;
      margin: 0;
      padding: 4rem 1.5rem;
    }
    a { color: #111; }
    .back {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
    }
    .back:hover { color: #111; }
    .piece {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 1rem;
    }
    .meta {
      margin-bottom: 2rem;
      color: #555;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .photo-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .photo-stack img {
      max-width: 100%;
      display: block;
      margin: 0 0 2rem;
    }
    .photo-stack img.small {
      max-width: 65%;
      margin-top: 3rem;
      margin-bottom: 5rem;
    }
    .photo-stack img.half {
      max-width: 50%;
    }
  </style>
</head>
<body>
  <a class="back" id="back-link" href="../work.html">← back to work</a>
  <div class="piece">
    <h1>Jungle Jungle Records</h1>
    <div class="meta">
      <p>2023</p>
    </div>
    <div class="photo-stack">
      <img class="small" src="../work/jungle/1.jpg" alt="Jungle Jungle Records">
      <img src="../work/jungle/2.jpg" alt="Jungle Jungle Records">
      <img class="half" src="../work/jungle/3.jpg" alt="Jungle Jungle Records">
      <img src="../work/jungle/4.jpg" alt="Jungle Jungle Records">
      <img src="../work/jungle/5.jpg" alt="Jungle Jungle Records">
    </div>
  </div>
  <script>
    if (new URLSearchParams(window.location.search).get('from') === 'home') {
      const backLink = document.getElementById('back-link');
      backLink.href = '../index.html';
      backLink.textContent = '← back to home';
    }
  </script>
  <script src="../cursor-trail.js"></script>
</body>
</html>
